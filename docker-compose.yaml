  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    depends_on:
      db:
        condition: service_healthy
#      kafka:
#        condition: service_healthy
    ports:
      - "8080:8080"
      - "5005:5005"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_AUTH_SERVICE_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_AUTH_SERVICE_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_AUTH_SERVICE_DATASOURCE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      JAVA_TOOL_OPTIONS: >
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    restart: on-failure

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    depends_on:
      db:
        condition: service_healthy
#      kafka:
#        condition: service_healthy
    ports:
      - "8081:8080"
      - "5006:5005"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_ORDER_SERVICE_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_ORDER_SERVICE_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_ORDER_SERVICE_DATASOURCE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      JAVA_TOOL_OPTIONS: >
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: order-engine-frontend
    ports:
      - "80:80"

volumes:
  pgdata: